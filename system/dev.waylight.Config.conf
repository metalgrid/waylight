<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the daemon's bus name. -->
  <policy user="root">
    <allow own="dev.waylight.Config"/>
  </policy>
  <!-- Everyone may talk to the daemon (method calls and replies); privilege
       is enforced per call by polkit, not by the bus. -->
  <policy context="default">
    <allow send_destination="dev.waylight.Config"/>
  </policy>
</busconfig>
