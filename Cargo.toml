[package]
name = "waylight-greeter"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
cxx = "1.0.176"
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
greetd_ipc = { version = "=0.10.3", default-features = false }
freedesktop-desktop-entry = { version = "=0.8.3", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros", "signal"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
rustix = { version = "1", features = ["fs", "process"] }

[build-dependencies]
cxx-qt-build = "=0.10.0"

[dev-dependencies]
tempfile = "3"
